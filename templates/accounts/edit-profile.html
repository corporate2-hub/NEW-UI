{% extends "base.html" %}

{% block title %}Edit Profile — {{ company.meta_title|default:company.name|default:"Skill Jobs Training" }}{% endblock %}

{% block content %}
<section class="py-12">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold mb-8 grad-text">Edit Profile</h1>
        
        <div class="bg-white rounded-lg shadow p-8">
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-dark-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-dark-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Phone</label>
                    <input type="tel" name="phone" value="{{ user.phone|default:'' }}" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-dark-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Bio</label>
                    <textarea name="bio" rows="4" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-dark-500">{{ user.bio|default:'' }}</textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Profile Picture</label>
                    <input type="file" name="profile_image" accept="image/*" class="w-full">
                </div>
                
                <div class="flex gap-4">
                    <button type="submit" class="px-8 py-3 rounded-full font-bold text-white bg-gradient-to-r from-dark-500 to-purple-500 hover:from-dark-400 hover:to-purple-400 transition-all">
                        Save Changes
                    </button>
                    <a href="{% url 'accounts:profile' %}" class="px-8 py-3 rounded-full font-bold text-dark-600 bg-dark-50 hover:bg-dark-100 transition-colors">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
