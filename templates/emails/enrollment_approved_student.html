<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enrollment Approved</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f8fafc; margin:0; padding:24px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:640px; margin:0 auto; background:#ffffff; border:1px solid #e2e8f0; border-radius:10px;">
        <tr>
            <td style="padding:24px;">
                <h2 style="margin:0 0 12px; color:#0f172a;">Enrollment Approved</h2>
                <p style="margin:0 0 12px; color:#334155;">Hello {{ student_name }},</p>
                <p style="margin:0 0 10px; color:#334155;">Your enrollment has been approved.</p>
                <p style="margin:0 0 8px; color:#0f172a;"><strong>Course:</strong> {{ course_name }}</p>
                <p style="margin:0 0 8px; color:#0f172a;"><strong>Batch:</strong> {{ batch_name }}</p>
                <p style="margin:0 0 16px; color:#0f172a;"><strong>Approval Date:</strong> {{ approval_date }}</p>
                <p style="margin:0 0 20px;">
                    <a href="{{ dashboard_url }}" style="display:inline-block; background:#0f172a; color:#ffffff; text-decoration:none; padding:10px 16px; border-radius:8px; font-weight:700;">Go to My Enrollments</a>
                </p>
                <p style="margin:0; color:#64748b;">Regards,<br>{{ company_name }}</p>
                <p style="margin:16px 0 0; color:#94a3b8; font-size:12px;">&copy; {{ current_year }} {{ company_name }}. All rights reserved.</p>
            </td>
        </tr>
    </table>
</body>
</html>
